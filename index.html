<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GiftLink</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f8f9fa;
        }
        h1 {
            color: #333;
            font-size: 3rem;
        }
        p {
            color: #666;
            font-size: 1.2rem;
        }
        .btn-get-started {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-get-started:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- 1. Project Title / Site Name -->
    <h1>GiftLink</h1>
    
    <!-- 2. Brief description or tagline -->
    <p>Sharing gifts, spreading joy within your community.</p>
    
    <!-- 3. 'Get Started' button -->
    <button class="btn-get-started" onclick="alert('Welcome to GiftLink!')">Get Started</button>
</body>
</html>
